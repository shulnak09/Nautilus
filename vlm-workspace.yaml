apiVersion: v1
kind: Pod
metadata:
  name: vlm-workspace
  namespace: anayak
spec:
  containers:
    - name: workspace
      image: alpine/git:latest
      command: ["/bin/sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: storage
          mountPath: /workspace
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: vlm-storage
